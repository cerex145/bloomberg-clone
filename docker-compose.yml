version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bloomberg-postgres
    environment:
      POSTGRES_USER: bloomberg
      POSTGRES_PASSWORD: bloomberg123
      POSTGRES_DB: bloomberg_clone
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bloomberg-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bloomberg"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bloomberg-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - bloomberg-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  bloomberg-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
